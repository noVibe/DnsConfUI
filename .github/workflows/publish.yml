name: Publish image

# Builds the app into a public image so that running it needs nothing but Docker:
#
#   docker run -d -p 3000:3000 --name dnsconf-ui ghcr.io/novibe/dnsconfui
#
# `workflow_dispatch` is here so the image can be published from a branch by hand,
# from the Actions tab, without waiting for a merge.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # What lets GITHUB_TOKEN push to this repository's own package registry.
  packages: write

jobs:
  # The published image is the one that passed, rather than one built beside it.
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is lowercased here, because a registry path cannot carry
      # the capitals the repository name has.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # Only linux/amd64: Docker Desktop on Apple Silicon runs it under emulation
      # without the user doing anything, while building arm64 here would mean
      # compiling Next.js under QEMU, which takes tens of minutes per run. Adding
      # `platforms: linux/amd64,linux/arm64` below is the whole change if that
      # trade stops being worth it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
