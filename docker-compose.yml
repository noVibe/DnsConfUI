# ---------------------------------------------------------------------------
# DnsConf UI — local deployment
#
#   docker compose up --build
#
# Then open http://localhost:3000
#
# No .env file is needed: the app signs you in through the project's own GitHub
# OAuth App, and an OAuth App of your own is named in the UI instead, with no
# rebuild. .env is only there to move the app off port 3000.
# ---------------------------------------------------------------------------

services:
  dnsconf-ui:
    build:
      context: .
      dockerfile: Dockerfile

    image: dnsconf-ui:local
    container_name: dnsconf-ui

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    ports:
      # HOST_PORT is the port on your own machine; change it in .env if 3000
      # is already taken.
      - "${HOST_PORT:-3000}:3000"

    restart: unless-stopped

    # The app has no database and stores nothing, so it needs no volumes.
    security_opt:
      - no-new-privileges:true
