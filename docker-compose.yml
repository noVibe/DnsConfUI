# ---------------------------------------------------------------------------
# DnsConf UI — local deployment
#
#   docker compose up --build
#
# Then open http://localhost:3000
#
# No .env file is needed: without one the app signs you in through the
# project's own GitHub OAuth App. Copy .env.example to .env and set
# NEXT_PUBLIC_GITHUB_CLIENT_ID there to use an OAuth App of your own instead.
# ---------------------------------------------------------------------------

services:
  dnsconf-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the .env file next to this file — optional. When it is
        # empty or absent, the app falls back to the client ID built into the
        # source (see src/domain/github-app.ts).
        NEXT_PUBLIC_GITHUB_CLIENT_ID: '${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}'

    image: dnsconf-ui:local
    container_name: dnsconf-ui

    # The server routes read the Client ID at runtime as well; empty here
    # means the built-in one is used.
    environment:
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    ports:
      # HOST_PORT is the port on your own machine; change it in .env if 3000
      # is already taken.
      - "${HOST_PORT:-3000}:3000"

    restart: unless-stopped

    # The app has no database and stores nothing, so it needs no volumes.
    security_opt:
      - no-new-privileges:true
